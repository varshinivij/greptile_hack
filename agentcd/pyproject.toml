[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcd-bench"
version = "0.1.0"
description = "Compare Codex runs across two AGENTS.md commit versions."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
report = ["openai>=1.0"]

[project.scripts]
agents-bench = "agentcd_bench.cli:main"
agentcd-report = "agentcd_bench.report:main"
agentcd-evaluate = "agentcd_bench.evaluation_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentcd_bench*"]
