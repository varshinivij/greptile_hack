[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcd-bench"
version = "0.1.0"
description = "Compare Codex runs across two AGENTS.md commit versions."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agents-bench = "agentcd_bench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentcd_bench*"]
